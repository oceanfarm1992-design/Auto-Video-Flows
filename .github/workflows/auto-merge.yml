name: auto-merge-dependabot

# Auto-approve and merge Dependabot PRs for minor/patch updates.
# Major version bumps are left open for manual review.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to auto-merge
        id: decision
        run: |
          TYPE="${{ steps.meta.outputs.update-type }}"
          ECOSYSTEM="${{ steps.meta.outputs.package-ecosystem }}"
          # Always merge minor/patch for any ecosystem.
          # Also merge major bumps for github-actions (they are versioned tags,
          # not semver APIs — v4→v7 never breaks caller workflows).
          if [[ "$TYPE" == "version-update:semver-minor" ]] || \
             [[ "$TYPE" == "version-update:semver-patch" ]] || \
             [[ "$ECOSYSTEM" == "github-actions" ]]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-approve
        if: steps.decision.outputs.merge == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge
        if: steps.decision.outputs.merge == 'true'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
