name: rotate-short

# Single trigger for the whole pipeline: ONE VIDEO EVERY 2ND DAY in total,
# alternating men-short and power-short (so each series posts every 4th day).
# daily-short (historical/trending figures) is no longer run automatically;
# the workflow file is kept for manual `workflow_dispatch` runs only (or use
# rotate-short's force_flow input).
#
# The cron fires daily at 14:00 UTC; the job decides from the days since the
# Unix epoch (deterministic, no state, no month-boundary glitches like "*/2"):
#   day odd            -> rest day, nothing runs
#   day even, (day/2) even -> men-short
#   day even, (day/2) odd  -> power-short
# A manual run (workflow_dispatch) always runs, using the same alternation.

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC daily; the job posts only on every 2nd day
  workflow_dispatch:
    inputs:
      skip_post:
        description: "Build only, do not post"
        type: boolean
        default: true
      force_flow:
        description: "Force a specific flow instead of the daily rotation"
        type: choice
        options: ["", "daily-short", "men-short", "power-short"]
        default: ""
      format:
        description: "men/power only: narrated or skit (blank = each niche config's 'format')"
        type: choice
        options: ["", "narrated", "skit"]
        default: ""

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Pick today's flow and trigger it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_post || false }}
          FORCE_FLOW: ${{ inputs.force_flow }}
          FORMAT: ${{ inputs.format }}
        run: |
          DAY=$(( $(date -u +%s) / 86400 ))
          if [ -n "$FORCE_FLOW" ]; then
            WF="$FORCE_FLOW"
          else
            if [ "${{ github.event_name }}" = "schedule" ] && [ $(( DAY % 2 )) -ne 0 ]; then
              echo "Rest day (one video every 2nd day). Next video tomorrow."
              exit 0
            fi
            case $(( DAY / 2 % 2 )) in
              0) WF="men-short" ;;
              1) WF="power-short" ;;
            esac
          fi
          echo "Today's flow: $WF (skip_post=$SKIP_POST)"
          EXTRA=""
          if [ -n "$FORMAT" ] && [ "$WF" != "daily-short" ]; then EXTRA="-f format=$FORMAT"; fi
          gh workflow run "$WF.yml" -f skip_post="$SKIP_POST" $EXTRA --repo "${{ github.repository }}"
