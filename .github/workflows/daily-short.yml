name: daily-short

on:
  schedule:
    - cron: "0 14 * * *"   # daily 14:00 UTC -> build + post
  workflow_dispatch:
    inputs:
      footage_source:
        description: "Force footage source (blank = auto: pexels -> pixabay -> animate)"
        type: choice
        options: ["", "pexels", "pixabay", "animate", "archive"]
        default: ""
      topic_index:
        description: "Force a specific topic index from config/topics.json (blank = random)"
        default: ""

permissions:
  contents: write

jobs:
  build_and_post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg, fonts, espeak fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Install python deps
        run: pip install -r requirements.txt

      # ── Stage 1: AI generates a fresh historical success story ──────────────
      - name: Generate script (OpenAI GPT)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TOPIC_ARG=""
          if [ -n "${{ inputs.topic_index }}" ]; then
            TOPIC_ARG="--topic-index ${{ inputs.topic_index }}"
          fi
          python scripts/generate_script_ai.py $TOPIC_ARG

      # ── Stage 2: fetch footage matched to the AI-generated query ─────────────
      - name: Fetch footage (Pexels / Pixabay / animation)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          ARG=""
          if [ -n "${{ inputs.footage_source }}" ]; then
            ARG="--source ${{ inputs.footage_source }}"
          fi
          python scripts/fetch_footage.py $ARG

      # ── Stage 3: OpenAI TTS voice → Piper → espeak fallback chain ────────────
      - name: Generate TTS voiceover
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/generate_tts.py \
            || python scripts/generate_tts.py --fallback piper \
            || python scripts/generate_tts.py --fallback espeak

      # ── Stage 4-6: captions, music, assembly (unchanged) ─────────────────────
      - name: Generate captions
        run: python scripts/generate_captions.py

      - name: Generate background music
        run: python scripts/generate_music.py

      - name: Assemble video
        run: python scripts/assemble_video.py

      # ── Publish as GitHub Release asset (Zapier needs a public URL) ──────────
      - name: Publish video as release asset
        id: publish_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="daily-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" build/final.mp4 \
            --title "$TAG" --notes "Automated daily short" --latest=false
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/final.mp4"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Public video URL: $URL"

      # ── Post via Google Sheet → Zapier → Instagram / Facebook / YouTube ───────
      - name: Post via Google Sheet (Zapier)
        id: post_sheet
        continue-on-error: true
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: |
          python scripts/post_sheet.py \
            --video-url "${{ steps.publish_asset.outputs.video_url }}" \
            --script build/script.json \
            --caption-file build/caption_meta.txt \
            --config config/sources.json

      # ── Commit run log back to repo ───────────────────────────────────────────
      - name: Append run to history log
        if: always()
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SCRIPT_TITLE=$(python -c "import json;print(json.load(open('build/script.json'))['title'])" 2>/dev/null || echo "unknown")
          IDENT=$(python -c "import json;d=json.load(open('build/footage.json'));print(d.get('identifier', d.get('source','?')))" 2>/dev/null || echo "unknown")
          echo "${DATE},\"${SCRIPT_TITLE}\",${IDENT},${{ steps.post_sheet.outcome }}" >> logs/history.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/history.csv logs/used_topics.json 2>/dev/null || true
          git commit -m "log: daily run ${DATE}" || echo "nothing to commit"
          git push
