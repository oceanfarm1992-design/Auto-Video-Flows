name: daily-short

on:
  schedule:
    - cron: "0 8  * * *"   # TikTok run 1 — 08:00 UTC (morning)
    - cron: "0 14 * * *"   # TikTok run 2 — 14:00 UTC (midday) + Zapier post
    - cron: "0 20 * * *"   # TikTok run 3 — 20:00 UTC (evening)
  workflow_dispatch:
    inputs:
      footage_source:
        description: "Force footage source for all segments (blank = auto)"
        type: choice
        options: ["", "pexels_video", "pixabay_video", "pexels_photo", "pixabay_photo", "animate"]
        default: ""
      topic_index:
        description: "Force a specific topic index from config/topics.json (blank = random)"
        default: ""
      skip_post:
        description: "Set to 'true' to build the video but skip posting to the sheet"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_and_post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg, fonts, espeak fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Install python deps
        run: |
          # CPU-only torch first — StyleTTS2/Kokoro depend on it, and the default
          # PyPI wheel bundles CUDA and is far larger than this runner needs.
          pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # ── Stage 1: AI generates a fresh historical success story ──────────────
      # Tries a trending real-person angle first (web search + NewsAPI headlines +
      # YouTube's trending chart), falling back to config/topics.json's static list
      # if nothing fits.
      - name: Generate script (OpenAI GPT)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_SECRETS: ${{ secrets.NEWS_SECRETS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          TOPIC_ARG=""
          if [ -n "${{ inputs.topic_index }}" ]; then
            TOPIC_ARG="--topic-index ${{ inputs.topic_index }}"
          fi
          python scripts/generate_script_ai.py $TOPIC_ARG

      # ── Stage 1.5: fact-check the AI-written narration before anything else uses it ─
      # generate_script_ai.py's prompt asks GPT-4o-mini for "real details (years,
      # numbers, names)" about a real historical figure — exactly what small models
      # hallucinate. This re-checks those claims with web search. Minor errors are
      # auto-corrected in place; if the core story can't be verified, the run aborts
      # here rather than build and post it.
      - name: Fact-check narration (OpenAI web search)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/factcheck_script.py

      # ── Stage 2: TTS first (so captions + footage can use real audio duration) ─
      # Tries StyleTTS2 (cloned voice) first, then falls back through Kokoro,
      # Piper, and espeak-ng in one call before giving up.
      - name: Generate TTS voiceover
        env:
          VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
        run: python scripts/generate_tts.py

      # ── Stage 3: Whisper-synced captions (word-level timestamps) ─────────────
      - name: Generate captions (Whisper word-level sync)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_captions.py

      # ── Stage 4: Fetch one clip/photo per story segment ──────────────────────
      - name: Fetch multi-segment footage
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          ARG=""
          if [ -n "${{ inputs.footage_source }}" ]; then
            ARG="--force-source ${{ inputs.footage_source }}"
          fi
          python scripts/fetch_footage_multi.py $ARG

      - name: Generate background music
        run: python scripts/generate_music.py

      - name: Assemble video
        run: python scripts/assemble_video.py

      # ── Publish as GitHub Release asset (Zapier needs a public URL) ──────────
      - name: Publish video as release asset
        id: publish_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="daily-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" build/final.mp4 \
            --title "$TAG" --notes "Automated daily short" --latest=false
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/final.mp4"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Public video URL: $URL"

      # ── TikTok + Facebook + Instagram: Buffer (all 3 daily runs) ─────────────
      - name: Post to TikTok + Facebook + Instagram via Buffer
        id: post_buffer
        if: ${{ inputs.skip_post != true }}
        continue-on-error: true
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
        run: |
          python scripts/post_buffer.py \
            --video-url "${{ steps.publish_asset.outputs.video_url }}" \
            --script build/script.json \
            --caption-file build/caption_meta.txt \
            --services tiktok,facebook,instagram

      # ── YouTube: Zapier (all 3 daily runs — free tier) ───────────────────────
      - name: Post to YouTube via Zapier (Google Sheet webhook)
        id: post_sheet
        if: ${{ inputs.skip_post != true }}
        continue-on-error: true
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: |
          python scripts/post_sheet.py \
            --video-url "${{ steps.publish_asset.outputs.video_url }}" \
            --script build/script.json \
            --caption-file build/caption_meta.txt \
            --config config/sources.json

      # ── Commit run log back to repo ───────────────────────────────────────────
      - name: Append run to history log
        if: always()
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SCRIPT_TITLE=$(python -c "import json;print(json.load(open('build/script.json'))['title'])" 2>/dev/null || echo "unknown")
          TOPIC_SOURCE=$(python -c "import json;print(json.load(open('build/script.json')).get('topic_source','unknown'))" 2>/dev/null || echo "unknown")
          IDENT=$(python -c "import json;m=json.load(open('build/footage_manifest.json'));print(','.join(c.get('source','?') for c in m))" 2>/dev/null || echo "unknown")
          FACTCHECK=$(python -c "import json;print(json.load(open('build/factcheck.json'))['verdict'])" 2>/dev/null || echo "unknown")
          echo "${DATE},\"${SCRIPT_TITLE}\",topic=${TOPIC_SOURCE},${IDENT},factcheck=${FACTCHECK},buffer=${{ steps.post_buffer.outcome }},zapier=${{ steps.post_sheet.outcome }}" >> logs/history.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/history.csv logs/used_topics.json 2>/dev/null || true
          git commit -m "log: daily run ${DATE}" || echo "nothing to commit"
          git push
