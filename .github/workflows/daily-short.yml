name: daily-short

# Single daily schedule: build the short and hand it off for posting by appending a
# row to the shared Google Sheet that Zapier watches. No token-refresh job is needed
# anymore — posting auth lives in Zapier, not in this repo.
on:
  schedule:
    - cron: "0 14 * * *"   # daily 14:00 UTC -> build + post
  workflow_dispatch:
    inputs:
      footage_source:
        description: "Force footage source (blank = auto: pexels -> pixabay -> animate)"
        type: choice
        options: ["", "pexels", "pixabay", "animate", "archive"]
        default: ""

permissions:
  contents: write          # commit logs/history.csv and create the release asset

jobs:
  build_and_post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg, fonts, espeak fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Install python deps
        run: pip install -r requirements.txt

      # ---- content pipeline ----
      - name: Fetch script text
        run: python scripts/fetch_script_text.py

      - name: Fetch footage (Pexels / Pixabay / animation)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          ARG=""
          if [ -n "${{ inputs.footage_source }}" ]; then
            ARG="--source ${{ inputs.footage_source }}"
          fi
          python scripts/fetch_footage.py $ARG

      - name: Generate TTS voiceover
        # If Piper install/model download misbehaves, fall back to espeak-ng so the
        # daily run still produces audio instead of failing hard.
        run: |
          python scripts/generate_tts.py || \
          python scripts/generate_tts.py --fallback espeak

      - name: Generate captions
        run: python scripts/generate_captions.py

      - name: Generate background music (ambient pad)
        run: python scripts/generate_music.py

      - name: Assemble video
        run: python scripts/assemble_video.py

      # ---- make the video publicly fetchable (Zapier / Instagram Reels needs a public URL) ----
      # NOTE: release assets are only PUBLICLY reachable if this repo is PUBLIC.
      # For a private repo, host final.mp4 elsewhere and set the URL accordingly.
      - name: Publish video as release asset
        id: publish_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="daily-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" build/final.mp4 \
            --title "$TAG" --notes "Automated daily short" --latest=false
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/final.mp4"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Public video URL: $URL"

      # ---- posting: append one row to the shared Google Sheet; Zapier does the rest ----
      # One Zap per platform (Instagram / Facebook / YouTube) watches this sheet with a
      # free "New Spreadsheet Row" trigger and posts via Zapier's own connections. No
      # platform tokens are stored in this repo. TikTok is intentionally omitted (app
      # not audited; no free Zapier TikTok posting integration).
      - name: Post via Google Sheet (Zapier)
        id: post_sheet
        continue-on-error: true
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: |
          python scripts/post_sheet.py \
            --video-url "${{ steps.publish_asset.outputs.video_url }}" \
            --script build/script.json \
            --caption-file build/caption_meta.txt \
            --config config/sources.json

      # ---- log results back to the repo ----
      - name: Append run to history log
        if: always()
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SCRIPT_TITLE=$(python -c "import json;print(json.load(open('build/script.json'))['title'])" 2>/dev/null || echo "unknown")
          IDENT=$(python -c "import json;print(json.load(open('build/footage.json'))['identifier'])" 2>/dev/null || echo "unknown")
          echo "${DATE},\"${SCRIPT_TITLE}\",${IDENT},${{ steps.post_sheet.outcome }}" >> logs/history.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/history.csv
          git commit -m "log: daily run ${DATE}" || echo "nothing to commit"
          git push
