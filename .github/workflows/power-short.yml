name: power-short

on:
  # No schedule here — rotate-short.yml runs once/day at 14:00 UTC and
  # triggers whichever of daily-short/men-short/power-short is today's turn.
  workflow_dispatch:
    inputs:
      skip_post:
        description: "Build only, do not post"
        type: boolean
        default: true
      topic_index:
        description: "Force a topic index (blank = random)"
        default: ""

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/niche-short.yml
    with:
      niche: power_psychology
      skip_post: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_post }}
      topic_index: ${{ inputs.topic_index || '' }}
    secrets: inherit
