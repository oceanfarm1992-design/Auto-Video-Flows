name: niche-short

# Reusable pipeline for topic-based series (men_psychology, power_psychology).
# Called by men-short.yml / power-short.yml. TikTok/Facebook/Instagram post via the
# main Buffer account; YouTube posts via a SECOND Buffer account. No Zapier here.

on:
  workflow_call:
    inputs:
      niche:
        description: "Series id: file name in config/niches/ without .json"
        type: string
        required: true
      skip_post:
        type: boolean
        default: true
      topic_index:
        type: string
        default: ""
      force_source:
        description: "Force one footage source for every segment (e.g. doodle); blank = stock with fallbacks"
        type: string
        default: ""
      format:
        description: "narrated | skit; blank = the niche config's 'format'"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build_and_post:
    runs-on: ubuntu-latest
    concurrency:
      group: niche-${{ inputs.niche }}
      cancel-in-progress: false
    env:
      NICHE_CFG: config/niches/${{ inputs.niche }}.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Install python deps
        run: |
          pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Resolve video format
        id: fmt
        env:
          FORMAT_INPUT: ${{ inputs.format }}
        run: |
          F="$FORMAT_INPUT"
          [ -n "$F" ] || F=$(python -c "import json;print(json.load(open('$NICHE_CFG')).get('format','narrated'))")
          [ "$F" = "skit" ] || F="narrated"
          echo "format=$F" >> "$GITHUB_OUTPUT"
          echo "Format: $F"

      # ── narrated format (one voice over doodle / stock footage) ──────────────
      - name: Generate script (OpenAI GPT)
        if: steps.fmt.outputs.format == 'narrated'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_API }}
          TOPIC_INDEX: ${{ inputs.topic_index }}
        run: |
          TOPIC_ARG=""
          if [ -n "$TOPIC_INDEX" ]; then
            case "$TOPIC_INDEX" in *[!0-9]*) echo "topic_index must be a number"; exit 1;; esac
            TOPIC_ARG="--topic-index $TOPIC_INDEX"
          fi
          python scripts/generate_script_niche.py --niche "$NICHE_CFG" $TOPIC_ARG

      # Fact-check; on a failed verdict regenerate once with a fresh topic.
      - name: Fact-check narration (OpenAI web search)
        if: steps.fmt.outputs.format == 'narrated'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if ! python scripts/factcheck_script.py; then
            echo "Failed fact-check; regenerating once with a new topic..."
            python scripts/generate_script_niche.py --niche "$NICHE_CFG"
            python scripts/factcheck_script.py
          fi

      - name: Generate TTS voiceover
        if: steps.fmt.outputs.format == 'narrated'
        env:
          VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
        run: python scripts/generate_tts.py --engine styletts2

      - name: Generate captions (Whisper)
        if: steps.fmt.outputs.format == 'narrated'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_captions.py

      - name: Fetch multi-segment footage
        if: steps.fmt.outputs.format == 'narrated'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FORCE_SOURCE: ${{ inputs.force_source }}
        run: |
          # Visuals: the run's force_source input wins; otherwise the series' "visuals" setting
          # (doodle = stick-man animation, stock = Pexels/Pixabay). Pass "stock" to force stock.
          SRC="$FORCE_SOURCE"
          [ -n "$SRC" ] || SRC=$(python -c "import json;print(json.load(open('$NICHE_CFG')).get('visuals',''))")
          ARG=""
          if [ -n "$SRC" ] && [ "$SRC" != "stock" ]; then
            ARG="--force-source $SRC"
          fi
          echo "Visuals: ${SRC:-stock}"
          python scripts/fetch_footage_multi.py --min-clip 2.5 $ARG

      - name: Generate background music
        run: python scripts/generate_music.py

      - name: Assemble video
        if: steps.fmt.outputs.format == 'narrated'
        run: python scripts/assemble_video.py --config "$NICHE_CFG"

      # ── skit format (recurring cartoon cast, dialogue, AI keyframes + image-to-video) ──
      - name: "Skit: write the skit (free OpenRouter model, OpenAI fallback)"
        if: steps.fmt.outputs.format == 'skit'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_API }}
          TOPIC_INDEX: ${{ inputs.topic_index }}
        run: |
          TOPIC_ARG=""
          if [ -n "$TOPIC_INDEX" ]; then
            case "$TOPIC_INDEX" in *[!0-9]*) echo "topic_index must be a number"; exit 1;; esac
            TOPIC_ARG="--topic-index $TOPIC_INDEX"
          fi
          python scripts/generate_skit.py --niche "$NICHE_CFG" $TOPIC_ARG

      # The skit's lines are what gets voiced, so a "corrected narration" can't be applied in
      # place: on any verdict other than pass/skip, write a fresh skit on a new topic once.
      - name: "Skit: fact-check"
        if: steps.fmt.outputs.format == 'skit'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_API }}
        run: |
          ok() { python -c "import json,sys;v=json.load(open('build/factcheck.json')).get('verdict','');sys.exit(0 if v in ('pass','skipped_no_claims','error') else 1)"; }
          if ! python scripts/factcheck_script.py || ! ok; then
            echo "Fact-check did not pass cleanly; writing a new skit on another topic..."
            python scripts/generate_skit.py --niche "$NICHE_CFG"
            python scripts/factcheck_script.py
          fi

      - name: "Skit: character voices"
        if: steps.fmt.outputs.format == 'skit'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
        run: python scripts/generate_dialogue_tts.py --niche "$NICHE_CFG"

      - name: "Skit: captions"
        if: steps.fmt.outputs.format == 'skit'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          HL=$(python -c "import json;print(json.load(open('config/skit.json'))['edit']['caption_highlight'])")
          python scripts/generate_captions.py --timeline build/skit_timeline.json --highlight "$HL"

      - name: "Skit: cast, locations and keyframes"
        if: steps.fmt.outputs.format == 'skit'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_API }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
        run: python scripts/generate_keyframes.py --niche "$NICHE_CFG"

      # Better lip sync for the free doodle shots (scripts/lipsync.py). Optional: without it
      # the built-in text + loudness method is used.
      - name: "Skit: install Rhubarb Lip Sync (optional)"
        if: steps.fmt.outputs.format == 'skit'
        continue-on-error: true
        run: |
          V=1.14.0
          curl -fsSL -o /tmp/rhubarb.zip "https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v${V}/Rhubarb-Lip-Sync-${V}-Linux.zip"
          sudo unzip -q -o /tmp/rhubarb.zip -d /opt
          BIN=$(find /opt -maxdepth 2 -type f -name rhubarb | head -1)
          [ -n "$BIN" ] && echo "RHUBARB_BIN=$BIN" >> "$GITHUB_ENV" && "$BIN" --version

      - name: "Skit: animate shots"
        if: steps.fmt.outputs.format == 'skit'
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER }}
        run: python scripts/animate_shots.py --niche "$NICHE_CFG"

      - name: "Skit: edit"
        if: steps.fmt.outputs.format == 'skit'
        run: python scripts/assemble_skit.py --niche "$NICHE_CFG"

      # Optional preview: an artifact-service hiccup must never stop the video from publishing.
      - name: "Skit: keep a preview of the keyframes"
        if: ${{ always() && steps.fmt.outputs.format == 'skit' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: skit-${{ inputs.niche }}-${{ github.run_id }}
          path: |
            build/script.json
            build/keyframes/
            build/skit_timeline.json
          if-no-files-found: ignore

      - name: Publish video as release asset
        id: publish_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.niche }}-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" build/final.mp4 \
            --title "$TAG" --notes "Automated short" --latest=false
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/final.mp4"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Public video URL: $URL"

      - name: Post to TikTok + Facebook + Instagram (Buffer account 1)
        id: post_buffer
        if: ${{ inputs.skip_post != true }}
        continue-on-error: true
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
        run: |
          python scripts/post_buffer.py \
            --video-url "${{ steps.publish_asset.outputs.video_url }}" \
            --script build/script.json \
            --caption-file build/caption_meta.txt \
            --caption-file-tiktok build/caption_tiktok.txt \
            --services tiktok,facebook,instagram

      - name: Post to YouTube (Buffer account 2)
        id: post_youtube
        if: ${{ inputs.skip_post != true }}
        continue-on-error: true
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_YT_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_YT_ORG_ID }}
        run: |
          if [ -z "$BUFFER_TOKEN" ]; then
            echo "BUFFER_YT_API_KEY secret not set; skipping YouTube."
            echo "yt_skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/post_buffer.py \
            --video-url "${{ steps.publish_asset.outputs.video_url }}" \
            --script build/script.json \
            --caption-file build/caption_meta.txt \
            --caption-file-youtube build/yt_description.txt \
            --title-file build/yt_title.txt \
            --services youtube

      # Only on the default branch, so test runs of a feature branch never write logs.
      - name: Append run to history log
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HIST=$(python -c "import json;print(json.load(open('$NICHE_CFG'))['history_log'])")
          USED=$(python -c "import json;print(json.load(open('$NICHE_CFG'))['used_log'])")
          TITLE=$(python -c "import json;print(json.load(open('build/script.json'))['title'])" 2>/dev/null || echo "unknown")
          FACTCHECK=$(python -c "import json;print(json.load(open('build/factcheck.json'))['verdict'])" 2>/dev/null || echo "unknown")
          echo "${DATE},\"${TITLE}\",factcheck=${FACTCHECK},buffer=${{ steps.post_buffer.outcome }},youtube=${{ steps.post_youtube.outputs.yt_skipped == 'true' && 'skipped' || steps.post_youtube.outcome }}" >> "$HIST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$HIST" "$USED" 2>/dev/null || true
          # first skit runs design the cast and locations: keep them so every later video reuses them
          git add assets/skit 2>/dev/null || true
          git commit -m "log: ${{ inputs.niche }} run ${DATE}" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          echo "::warning::could not push history log"
          exit 0
