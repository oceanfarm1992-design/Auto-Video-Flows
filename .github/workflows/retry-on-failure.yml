name: retry-on-failure

# If today's rotated build (daily-short/men-short/power-short, triggered by
# rotate-short.yml) fails, automatically retry it once.
# Only retries on the first failure (run_attempt == 1) so a second
# failure doesn't trigger an infinite loop.
on:
  workflow_run:
    workflows: ["daily-short", "men-short", "power-short"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    steps:
      - name: Re-trigger the failed flow (skip_post=false for a real retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF="${{ github.event.workflow_run.name }}"
          echo "$WF failed on attempt 1 — auto-retrying..."
          gh workflow run "$WF.yml" -f skip_post=false --repo "${{ github.repository }}"
          echo "Retry triggered."
