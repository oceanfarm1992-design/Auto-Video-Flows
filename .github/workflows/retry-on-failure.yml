name: retry-on-failure

# If the daily-short build fails, automatically retry it once.
# Only retries on the first failure (run_attempt == 1) so a second
# failure doesn't trigger an infinite loop.
on:
  workflow_run:
    workflows: ["daily-short"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    steps:
      - name: Re-trigger daily-short (skip_post kept as false for real retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Daily build failed on attempt 1 — auto-retrying..."
          gh workflow run daily-short.yml \
            --repo "${{ github.repository }}"
          echo "Retry triggered."
