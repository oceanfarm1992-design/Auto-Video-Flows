name: buffer-introspect
# Temporary: discover Buffer's publishing mutation + input schema.
on:
  workflow_dispatch:

jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Introspect Buffer schema
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INTROSPECT: "1"
        run: python scripts/post_buffer.py --video-url x --services tiktok
